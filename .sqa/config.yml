config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/resource-catalogue:
      branch: master
      repo: https://github.com/madgeek-arc/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.violet_productive_grizzly.sh
        container: qc.acc_mist_visionary_rattlesnake
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_wondrous_gull.sh
        container: qc.doc_beige_alert_opossum
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.dahlia_calm_manatee.sh
        container: qc.doc_lime_joyful_camel
      github.com/madgeek-arc/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_romantic_lynx.sh
        container: qc.doc_white_mature_warthog
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.poppy_clever_wombat.sh
        container: qc.lic_heather_focused_wolverine
  QC.Sty:
    repos:
      github.com/madgeek-arc/resource-catalogue checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.ebony_easygoing_turtle.sh
        container: qc.sty_pine_bold_gerbil
      github.com/madgeek-arc/resource-catalogue hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_humble_newt.sh
        container: qc.sty_gunmetal_adventurous_orangutan
      github.com/madgeek-arc/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.raven_eager_newt.sh
        container: qc.sty_rust_clever_dolphin
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.glaucous_savvy_frog.sh
        container: qc.ver_slate_loving_dhole
timeout: 5400
