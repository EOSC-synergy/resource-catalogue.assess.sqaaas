config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/resource-catalogue:
      branch: master
      repo: https://github.com/madgeek-arc/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-taupe-iguana.sh
        container: qc.acc_ready-gamboge-eleuth
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-amber-oyster.sh
        container: qc.doc_gloppy-magenta-ant
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.randy-dandelion-havanese.sh
        container: qc.doc_shaggy-yellow-fish
      github.com/madgeek-arc/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.jumpy-magenta-toucan.sh
        container: qc.doc_flimsy-ecru-ray
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-cobalt-serval.sh
        container: qc.lic_flaky-apricot-kiwi
  QC.Sty:
    repos:
      github.com/madgeek-arc/resource-catalogue checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.homely-chestnut-abyssinian.sh
        container: qc.sty_paltry-wheat-cattle
      github.com/madgeek-arc/resource-catalogue hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-olive-wolf.sh
        container: qc.sty_freaky-cornflower-lion
      github.com/madgeek-arc/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.stealthy-lime-robin.sh
        container: qc.sty_boozy-plum-antelope
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-thistle-robin.sh
        container: qc.ver_woolly-wisteria-alligator
timeout: 5400
