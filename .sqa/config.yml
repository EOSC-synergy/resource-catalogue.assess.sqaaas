config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/resource-catalogue:
      branch: master
      repo: https://github.com/madgeek-arc/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.butterscotch_zealous_snail.sh
        container: qc.acc_beige_thankful_crocodile
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_radiant_lemur.sh
        container: qc.doc_tide_hardworking_hamster
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_brilliant_badger.sh
        container: qc.doc_flint_insightful_mink
      github.com/madgeek-arc/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_savvy_macaw.sh
        container: qc.doc_ginger_scrappy_whale
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.plum_lively_dolphin.sh
        container: qc.lic_gray_assured_pegasus
  QC.Sty:
    repos:
      github.com/madgeek-arc/resource-catalogue checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_forgiving_nymph.sh
        container: qc.sty_pineapple_eccentric_camel
      github.com/madgeek-arc/resource-catalogue hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_meticulous_turkey.sh
        container: qc.sty_ceru_proud_gorilla
      github.com/madgeek-arc/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.orange_thoughtful_heron.sh
        container: qc.sty_carmine_creative_gibbon
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.paprika_productive_capybara.sh
        container: qc.ver_cream_spirited_capybara
timeout: 5400
