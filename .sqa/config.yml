config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/resource-catalogue:
      branch: cessda
      repo: https://github.com/cessda/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.byzantium_apathetic_cormorant.sh
        container: qc.acc_viridian_mindful_pegasus
  QC.Doc:
    repos:
      github.com/cessda/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_apprehensive_antelope.sh
        container: qc.doc_gold_imaginative_lemur
      github.com/cessda/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_sweet_crow.sh
        container: qc.doc_sepia_sweet_seahorse
      github.com/cessda/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.fandango_artistic_armadillo.sh
        container: qc.doc_scarlet_bubbly_fox
  QC.Lic:
    repos:
      github.com/cessda/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.slate_artistic_porcupine.sh
        container: qc.lic_papaya_sociable_nymph
