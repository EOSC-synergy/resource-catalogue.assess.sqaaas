config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/resource-catalogue:
      branch: master
      repo: https://github.com/madgeek-arc/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_protective_ibex.sh
        container: qc.acc_tundra_dizzy_alligator
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_methodical_kookaburra.sh
        container: qc.doc_coffee_candid_roadrunner
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.white_flexible_emu.sh
        container: qc.doc_iris_balanced_jaguar
      github.com/madgeek-arc/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.magenta_optimistic_elephant.sh
        container: qc.doc_aquamarine_tranquil_lemur
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ultramarine_rustic_axolotl.sh
        container: qc.lic_lemon_cranky_cockatoo
  QC.Sty:
    repos:
      github.com/madgeek-arc/resource-catalogue checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_stoic_kraken.sh
        container: qc.sty_fern_friendly_hyena
      github.com/madgeek-arc/resource-catalogue hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.onyx_clever_capybara.sh
        container: qc.sty_plum_forgiving_gecko
      github.com/madgeek-arc/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.pine_sociable_porcupine.sh
        container: qc.sty_obsidian_empathetic_orca
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cyan_calm_penguin.sh
        container: qc.ver_amaranth_reserved_penguin
timeout: 5400
