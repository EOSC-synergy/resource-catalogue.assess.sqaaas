config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/resource-catalogue:
      branch: master
      repo: https://github.com/madgeek-arc/resource-catalogue
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-celadon-harrier.sh
        container: qc.acc_greasy-cornflower-binturong
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-vermilion-dugong.sh
        container: qc.doc_wiggy-purple-ibis
      github.com/madgeek-arc/resource-catalogue git:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-jade-sheepdog.sh
        container: qc.doc_ready-saffron-clam
      github.com/madgeek-arc/resource-catalogue markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.randy-corn-barnacle.sh
        container: qc.doc_geeky-celadon-weasel
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue licensee:
        commands:
        - /usr/bin/env sh .sqa/script.stealthy-goldenrod-tarantula.sh
        container: qc.lic_smelly-pumpkin-hound
  QC.Sty:
    repos:
      github.com/madgeek-arc/resource-catalogue checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-lime-turkey.sh
        container: qc.sty_craggy-firebrick-turkey
      github.com/madgeek-arc/resource-catalogue hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-flax-peccary.sh
        container: qc.sty_bluesy-maroon-hedgehog
      github.com/madgeek-arc/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-viridian-zonkey.sh
        container: qc.sty_slaphappy-pumpkin-crab
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.baggy-pear-barb.sh
        container: qc.ver_craggy-yellow-jaguar
timeout: 5400
