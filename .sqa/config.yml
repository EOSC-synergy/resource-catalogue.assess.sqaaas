      github.com/cessda/resource-catalogue jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.purple_radiant_serval.sh
        container: qc.sty_denim_attentive_roadrunner
  QC.Ver:
    repos:
      github.com/cessda/resource-catalogue get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.clementine_smart_heron.sh
        container: qc.ver_gold_wondrous_bison
